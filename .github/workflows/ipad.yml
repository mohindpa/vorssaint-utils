name: iPad native validation
on:
  push:
    branches: [main, ipad-on-steroids]
    paths: ['iPadOnSteroids/**', '.github/workflows/ipad.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipad-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iPadOnSteroids
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Validate project structure
        run: python3 scripts/check_project.py
      - name: Run core behavior tests
        run: swift test
      - name: Select an available iPad simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j > /tmp/ipad-simulators.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/ipad-simulators.json') as f:
              data = json.load(f)
          candidates = [(runtime, device) for runtime, devices in data['devices'].items() for device in devices if 'iPad' in device['name'] and device.get('isAvailable', False)]
          if not candidates:
              raise SystemExit('No available iPad simulator')
          runtime, device = sorted(candidates, key=lambda x: tuple(int(v) for v in x[0].split('iOS-')[-1].split('-') if v.isdigit()))[-1]
          print('Testing on', runtime, device['name'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('id=' + device['udid'] + '\n')
          PY
      - name: Build and test native iPad app
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project iPadOnSteroids.xcodeproj -scheme iPadOnSteroids -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath .build-native -resultBundlePath TestResults.xcresult test CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - name: Build optimized device binary without signing
        run: xcodebuild -project iPadOnSteroids.xcodeproj -scheme iPadOnSteroids -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build-device build CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-simulator-screenshots
          path: iPadOnSteroids/TestAttachments
          if-no-files-found: ignore
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-native-results
          path: iPadOnSteroids/TestResults.xcresult
          if-no-files-found: ignore
